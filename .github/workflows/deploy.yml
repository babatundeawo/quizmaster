# Builds, checks and publishes the website to GitHub Pages.
# Runs automatically whenever something is merged into the main branch.
# You can also run it by hand: Actions tab > Deploy site > Run workflow.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow may only read the code and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Prepare GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: python3 .github/scripts/build_site.py

      - name: Check the site
        run: python3 .github/scripts/check_site.py dist

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # A speed, accessibility and SEO report. It is for information only and
      # never stops a deployment.
      - name: Lighthouse report
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: ./dist
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
