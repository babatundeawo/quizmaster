# Runs on every pull request. It builds the site and runs the same checks as a
# real deployment, but publishes nothing, so the live site is never touched.
name: Pull request checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      # Pull requests use dummy Firebase values, so real secrets are never
      # exposed to code that has not been merged yet.
      - name: Build the site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FIREBASE_API_KEY: ci-check
          FIREBASE_AUTH_DOMAIN: ci-check.firebaseapp.com
          FIREBASE_PROJECT_ID: ci-check
          FIREBASE_STORAGE_BUCKET: ci-check.firebasestorage.app
          FIREBASE_MESSAGING_SENDER_ID: "0"
          FIREBASE_APP_ID: ci-check
        run: python3 .github/scripts/build_site.py

      - name: Check the site
        run: python3 .github/scripts/check_site.py dist

      - name: Lighthouse report
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: ./dist
          runs: 1
          uploadArtifacts: true
          temporaryPublicStorage: true
